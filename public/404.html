<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Discipline</title>
  </head>
  <body>
    <script>
      ;(function () {
        var pathname = location.pathname
        var base = pathname.indexOf('/Discipline/') === 0 ? '/Discipline/' : '/'
        var route = pathname.replace(/^\/Discipline\/?/, '').replace(/^\//, '')
        location.replace(base + (route ? '#/' + route : ''))
      })()
    </script>
    <noscript><a href="./">Discipline</a></noscript>
  </body>
</html>
